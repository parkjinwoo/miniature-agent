[workspace]
members = [
    "crates/agent-model",
    "crates/agent-core",
    "crates/agent-session",
    "crates/agent-tui",
    "crates/agent-tools",
    "crates/agent-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
async-trait = "0.1.91"
crossterm = "0.29.0"
futures = "0.3.33"
libc = "0.2.189"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "local-offset"] }
uuid = { version = "1.24.0", features = ["v4"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1.19"
schemars = "1.2.2"
toml = "1.1.4"
unicode-width = "0.2.2"
